name: Deploy Conciliacion to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-conciliacion-production
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: nullpointer-716ae
          workload_identity_provider: projects/646388363945/locations/global/workloadIdentityPools/github-actions/providers/matchconciliacion
          service_account: github-actions-firebase@nullpointer-716ae.iam.gserviceaccount.com
          create_credentials_file: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular application
        run: npm run build -- --configuration production

      - name: Deploy independent Firebase site
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: >-
          npx --yes firebase-tools@15.22.1 deploy
          --only hosting
          --project nullpointer-716ae
          --non-interactive
